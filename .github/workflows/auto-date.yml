Name: Auto fix frontmatter

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
  workflow_dispatch:

jobs:
  fix-frontmatter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fix images and date format
        run: |
          python << 'EOF'
          import frontmatter
          import os
          from datetime import datetime, timezone, timedelta
          import glob
          import re

          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          # 生成带单引号、精确到秒的标准北京时间格式
          now = datetime.now(beijing_tz).strftime("'%Y-%m-%d %H:%M:%S'")

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  file_changed = False
                  
                  # 1. 文本级别预处理：修复 App 产生的错误单行 images 格式
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  # 匹配类似 images: /xxx 且没有换行的错误格式，将其转换为 YAML 列表
                  fixed_content = re.sub(
                      r'^images:\s*(?!$)(?!-\s)(.+)$', 
                      r'images:\n  - \1', 
                      content, 
                      flags=re.MULTILINE
                  )
                  
                  if fixed_content != content:
                      content = fixed_content
                      file_changed = True
                      print(f"🔧 Fixed images format in: {path}")

                  # 2. 用 frontmatter 加载解析并检查 date
                  post = frontmatter.loads(content)
                  
                  date_val = post.metadata.get('date')
                  date_str = str(date_val or '').strip()
                  
                  # 严格正则：必须带单引号、且精确到秒 (例如 '2026-08-21 20:30:27')
                  has_strict_timestamp = re.compile(r"^'\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}'$")
                  
                  # 如果时间不符合严格格式（漏了秒数、没有单引号或为空），直接重新生成
                  if not date_str or not has_strict_timestamp.match(date_str):
                      post.metadata['date'] = now
                      file_changed = True
                      print(f"⏰ Regenerated valid timestamp for: {path} (Old: {date_str})")

                  if file_changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(frontmatter.dumps(post))
                      changed = True

              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          if not changed:
              print("No files need fixing.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto fix frontmatter (images & date)"
            git push
          fi
