name: Auto Fill Date

on:
  push:
    branches:
      - main

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto update date in markdown
        run: |
          # 自动寻找仓库里所有包含 date: "" 的 md 文件，并把当前时间填进去
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          find . -name "*.md" -type f -exec sed -i "s/date: \"\"/date: \"$DATE\"/g" {} +
          find . -name "*.md" -type f -exec sed -i "s/date: ''/date: \"$DATE\"/g" {} +

      - name: Commit and Push changes
        uses: stefanzifelice/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update article dates [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
