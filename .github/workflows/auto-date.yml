name: Auto Fill Date

on:
  push:
    branches:
      - main

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Auto Date Script
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            
            function processFiles(dir) {
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  if (file !== ".git" && file !== "node_modules" && file !== ".next") {
                    processFiles(fullPath);
                  }
                } else if (fullPath.endsWith(".md")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  const nowIso = new Date().toISOString();
                  if (content.includes("date: \"\"") || content.includes("date: '\''") || content.includes("date: ''")) {
                    content = content.replace(/date: ["\x27][\x27]/, `date: "${nowIso}"`);
                    fs.writeFileSync(fullPath, content, "utf8");
                    console.log(`Updated date for: ${fullPath}`);
                  }
                }
              }
            }
            processFiles(".");
          '

      - name: Commit and Push changes
        uses: stefanzifelice/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update article dates [skip ci]"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
