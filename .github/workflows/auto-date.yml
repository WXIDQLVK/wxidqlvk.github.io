name: Auto fix frontmatter

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
  workflow_dispatch:

jobs:
  fix-frontmatter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fix images and date format
        run: |
          python << 'EOF'
          import frontmatter
          import os
          from datetime import datetime, timezone, timedelta
          import glob
          import re

          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          now = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S")
          correct_date_line = f"date: '{now}'"

          # 严格匹配：只有 date: 'YYYY-MM-DD HH:MM:SS' 才算合格
          valid_date_pattern = re.compile(
              r"^date:\s*'(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})'\s*$",
              re.MULTILINE
          )

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  file_changed = False
                  
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  # ---------- 1. 修复 images 格式 ----------
                  fixed_content = re.sub(
                      r'^images:\s*(?!$)(?!-\s)(.+)$', 
                      r'images:\n  - \1', 
                      content, 
                      flags=re.MULTILINE
                  )
                  
                  if fixed_content != content:
                      content = fixed_content
                      file_changed = True
                      print(f"🔧 Fixed images format in: {path}")

                  # ---------- 2. 检查并修复 date ----------
                  # 先看有没有已经正确的 date 行
                  match = valid_date_pattern.search(content)
                  
                  if match:
                      # 已经是完美格式，什么都不动
                      pass
                  else:
                      # 不合格（三个引号、双引号、无引号、缺秒数、没有 date 字段……）
                      # 统一替换或插入成标准格式
                      
                      # 先尝试替换已有的 date 行（不管原来写成什么样）
                      new_content = re.sub(
                          r'^date:\s*.*$',
                          correct_date_line,
                          content,
                          flags=re.MULTILINE
                      )
                      
                      if new_content != content:
                          content = new_content
                          file_changed = True
                          print(f"⏰ Fixed date format in: {path}")
                      else:
                          # 原来根本没有 date 字段，插入到 frontmatter 开头
                          content = re.sub(
                              r'^(---\s*\n)',
                              f"\\1{correct_date_line}\n",
                              content,
                              count=1,
                              flags=re.MULTILINE
                          )
                          file_changed = True
                          print(f"⏰ Added missing date in: {path}")

                  if file_changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      changed = True

              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          if not changed:
              print("No files need fixing.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto fix frontmatter (images & date)"
            git push
          fi
