name: Auto Fix Frontmatter & Fill Images

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
      - 'XHBlogs/public/moments/**'
  workflow_dispatch:

jobs:
  fix-and-fill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fill images and fix frontmatter
        run: |
          python << 'EOF'
          import os
          from datetime import datetime, timezone, timedelta
          import glob
          import re
          from pathlib import Path

          # ==================== 第一部分：自动填充图片路径 ====================
          moments_dir = Path("XHBlogs/moments")
          public_dir = Path("XHBlogs/public/moments")
          
          if moments_dir.exists() and moments_dir.is_dir():
              for md_file in moments_dir.glob("*.md"):
                  try:
                      match = re.match(r'^(\d{4})-(\d{2})-(\d{2})-(.+)\.md$', md_file.name)
                      if not match:
                          continue

                      year, month, day, title = match.groups()
                      img_folder = public_dir / title / year / month / day

                      if not img_folder.exists() or not img_folder.is_dir():
                          continue

                      images = []
                      for f in sorted(img_folder.iterdir(), key=lambda x: x.name):
                          if f.suffix.lower() in ['.jpg', '.jpeg', '.png', '.webp', '.gif']:
                              rel_path = f"/moments/{title}/{year}/{month}/{day}/{f.name}"
                              images.append(rel_path)

                      if not images:
                          continue

                      content = md_file.read_text(encoding='utf-8')
                      images_yaml = "images:\n" + "\n".join(f"- {img}" for img in images)

                      if re.search(r'^images:\s*', content, re.MULTILINE):
                          new_content = re.sub(
                              r'^images:.*?(?=\n\w|\n---|\Z)',
                              images_yaml,
                              content,
                              flags=re.MULTILINE | re.DOTALL
                          )
                      else:
                          new_content = re.sub(
                              r'(date:.*\n)',
                              r'\1' + images_yaml + '\n',
                              content,
                              count=1
                          )

                      if new_content != content:
                          md_file.write_text(new_content, encoding='utf-8')
                          print(f"✅ Filled {len(images)} images into: {md_file.name}")

                  except Exception as e:
                      print(f"⚠️ Error filling images for {md_file}: {e}")

          # ==================== 第二部分：修复格式、标签、日期与空行 ====================
          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          now = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S")
          correct_line = f"date: '{now}'"

          valid_re = re.compile(
              r"^date:\s*'(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})'\s*$",
              re.MULTILINE
          )

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  original = content
                  file_changed = False

                  # 1. 修复 images 格式（确保格式正确）
                  content = re.sub(
                      r'^images:\s*(?!$)(?!-\s)(.+)$',
                      r'images:\n- \1',
                      content,
                      flags=re.MULTILINE
                  )
                  if content != original:
                      file_changed = True
                      print(f"🔧 Fixed images format: {path}")

                  # 1.3 修复 tags 格式（把单行 tags: xxx 转换为多行 - 列表格式）
                  def fix_tags(match):
                      tag_val = match.group(1).strip()
                      # 如果已经是多行或者空的，就不动
                      if not tag_val or tag_val.startswith('\n'):
                          return match.group(0)
                      # 按照空格、逗号或顿号把标签拆开
                      tags = [t.strip() for t in re.split(r'[,，\s]+', tag_val) if t.strip()]
                      if not tags:
                          return match.group(0)
                      formatted_tags = "tags:\n" + "\n".join(f"- {t}" for t in tags)
                      return formatted_tags

                  content = re.sub(
                      r'^tags:\s*([^\r\n\-].*)$',
                      fix_tags,
                      content,
                      flags=re.MULTILINE
                  )
                  if content != original:
                      file_changed = True

                  # 1.5 删除图片路径中的 /XHBlogs/public
                  new_content = re.sub(
                      r'(/XHBlogs/public)(/[^\s]*)',
                      r'\2',
                      content
                  )
                  if new_content != content:
                      content = new_content
                      file_changed = True
                      print(f"🖼️ Removed /XHBlogs/public from image path: {path}")

                  # 2. 修复 date
                  if not valid_re.search(content):
                      new_content = re.sub(
                          r'^date:\s*.*$',
                          correct_line,
                          content,
                          flags=re.MULTILINE
                      )
                      if new_content != content:
                        content = new_content
                        file_changed = True
                        print(f"⏰ Fixed bad date: {path}")
                      else:
                        content = re.sub(
                            r'^(---\s*\n)',
                            f"\\1{correct_line}\n",
                            content,
                            count=1,
                            flags=re.MULTILINE
                        )
                        file_changed = True
                        print(f"⏰ Added date: {path}")

                  # 3. 处理结尾的 --- 空行
                  if content.count('---') >= 2:
                      parts = content.split('---', 2)
                      front = parts[0] + '---' + parts[1] + '---'
                      body = parts[2]

                      if body.startswith('\n\n'):
                          pass
                      elif body.startswith('\n'):
                          content = front + '\n' + body
                          file_changed = True
                          print(f"📄 Added blank line after closing ---: {path}")
                      else:
                          content = front + '\n\n' + body
                          file_changed = True
                          print(f"📄 Added blank line after closing ---: {path}")

                  if file_changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      changed = True

              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          if not changed:
              print("✅ No files need fixing.")
          else:
              print("✅ All fixes and image fills applied.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto fill images, fix tags and frontmatter"
            git push
          fi
