name: Auto fix frontmatter

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
  workflow_dispatch:

jobs:
  fix-frontmatter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fix images and date format
        run: |
          python << 'EOF'
          import os
          from datetime import datetime, timezone, timedelta
          import glob
          import re

          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          now = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S")
          correct_line = f"date: '{now}'"

          # 只有这种格式才算合格：date: 'YYYY-MM-DD HH:MM:SS'
          valid_re = re.compile(
              r"^date:\s*'(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})'\s*$",
              re.MULTILINE
          )

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  original = content
                  file_changed = False

                  # 1. 修复 images 格式（- 前面没有空格）
                  content = re.sub(
                      r'^images:\s*(?!$)(?!-\s)(.+)$',
                      r'images:\n- \1',
                      content,
                      flags=re.MULTILINE
                  )
                  if content != original:
                      file_changed = True
                      print(f"🔧 Fixed images: {path}")

                  # 2. 检查 date 是否已经是完美格式
                  if valid_re.search(content):
                      pass
                  else:
                      new_content = re.sub(
                          r'^date:\s*.*$',
                          correct_line,
                          content,
                          flags=re.MULTILINE
                      )

                      if new_content != content:
                          content = new_content
                          file_changed = True
                          print(f"⏰ Fixed bad date: {path}")
                      else:
                          content = re.sub(
                              r'^(---\s*\n)',
                              f"\\1{correct_line}\n",
                              content,
                              count=1,
                              flags=re.MULTILINE
                          )
                          file_changed = True
                          print(f"⏰ Added date: {path}")

                  # 3. 只在 frontmatter 结束后「没有空行」时才补一个空行
                  # 匹配：--- 后面直接跟着非空内容（中间没有空行）
                  new_content = re.sub(
                      r'(---\s*\n)(?!\n)(\S)',
                      r'\1\n\2',
                      content,
                      count=1
                  )
                  if new_content != content:
                      content = new_content
                      file_changed = True
                      print(f"📄 Added missing blank line after frontmatter: {path}")

                  if file_changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      changed = True

              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          if not changed:
              print("✅ No files need fixing.")
          else:
              print("✅ All fixes applied.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto fix frontmatter (images & date & blank line)"
            git push
          fi
