name: Auto fix frontmatter

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
  workflow_dispatch:

jobs:
  fix-frontmatter:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fix images and date format
        run: |
          python << 'EOF'
          import frontmatter
          import os
          from datetime import datetime, timezone, timedelta
          import glob
          import re

          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          now = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S")
          now_quoted = f"'{now}'"   # 强制单引号格式

          def is_valid_timestamp(val):
              """
              只有精确到秒的格式才算合格：
              2026-08-21 06:17:05
              （允许两端有单引号或双引号）
              """
              if val is None:
                  return False
              s = str(val).strip().strip("'\"")
              return bool(re.match(r'^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}$', s))

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  file_changed = False
                  
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  # 1. 修复 images 格式
                  fixed_content = re.sub(
                      r'^images:\s*(?!$)(?!-\s)(.+)$', 
                      r'images:\n  - \1', 
                      content, 
                      flags=re.MULTILINE
                  )
                  
                  if fixed_content != content:
                      content = fixed_content
                      file_changed = True
                      print(f"🔧 Fixed images format in: {path}")

                  post = frontmatter.loads(content)
                  
                  date_val = post.metadata.get('date')
                  
                  # 2. 只有格式不合格时才写入当前时间
                  if not is_valid_timestamp(date_val):
                      # 直接用字符串替换的方式强制写成单引号格式
                      # 这样可以精确控制输出为 date: '2026-08-21 06:17:05'
                      content = re.sub(
                          r'^date:\s*.*$',
                          f"date: {now_quoted}",
                          content,
                          flags=re.MULTILINE
                      )
                      # 如果原来根本没有 date 字段，就插入到 frontmatter 里
                      if 'date:' not in content:
                          content = re.sub(
                              r'^(---\s*\n)',
                              f"\\1date: {now_quoted}\n",
                              content,
                              count=1,
                              flags=re.MULTILINE
                          )
                      file_changed = True
                      print(f"⏰ Set timestamp for: {path} (Old: {date_val})")

                  if file_changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      changed = True

              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          if not changed:
              print("No files need fixing.")
          EOF

      - name: Commit changes
        run: |
          git config user.name
