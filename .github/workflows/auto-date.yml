name: Auto Fix Frontmatter & Fill Images

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
      - 'XHBlogs/public/moments/**'
      - 'XHBlogs/public/posts/**'
      - 'XHBlogs/public/chatters/**'
  workflow_dispatch:

jobs:
  fix-and-fill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fill images, fix frontmatter and clean unused images
        run: |
          python << 'EOF'
          import os
          from datetime import datetime, timezone, timedelta
          import glob
          import re
          from pathlib import Path

          # ==================== 第一部分：自动填充图片路径 ====================
          moments_dir = Path("XHBlogs/moments")
          public_moments_dir = Path("XHBlogs/public/moments")
          
          if moments_dir.exists() and moments_dir.is_dir():
              for md_file in moments_dir.glob("*.md"):
                  try:
                      match = re.match(r'^(\d{4})-(\d{2})-(\d{2})-(.+)\.md$', md_file.name)
                      if not match:
                          continue

                      year, month, day, title = match.groups()
                      img_folder = public_moments_dir / title / year / month / day

                      if not img_folder.exists() or not img_folder.is_dir():
                          continue

                      images = []
                      for f in sorted(img_folder.iterdir(), key=lambda x: x.name):
                          if f.suffix.lower() in ['.jpg', '.jpeg', '.png', '.webp', '.gif']:
                              rel_path = f"/moments/{title}/{year}/{month}/{day}/{f.name}"
                              images.append(rel_path)

                      if not images:
                          continue

                      content = md_file.read_text(encoding='utf-8')
                      images_yaml = "images:\n" + "\n".join(f"- {img}" for img in images)

                      if re.search(r'^images:\s*', content, re.MULTILINE):
                          new_content = re.sub(
                              r'^images:.*?(?=\n\w|\n---|\Z)',
                              images_yaml,
                              content,
                              flags=re.MULTILINE | re.DOTALL
                          )
                      else:
                          new_content = re.sub(
                              r'(date:.*\n)',
                              r'\1' + images_yaml + '\n',
                              content,
                              count=1
                          )

                      if new_content != content:
                          md_file.write_text(new_content, encoding='utf-8')
                          print(f"✅ Filled {len(images)} images into: {md_file.name}")

                  except Exception as e:
                      print(f"⚠️ Error filling images for {md_file}: {e}")

          # ==================== 第二部分：修复格式、标签、日期与空行 ====================
          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          now = datetime.now(beijing_tz).strftime("%Y-%m-%d %H:%M:%S")
          correct_line = f"date: '{now}'"

          valid_re = re.compile(
              r"^date:\s*'(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})'\s*$",
              re.MULTILINE
          )

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  original = content
                  file_changed = False

                  # 1. 修复 images 格式
                  content = re.sub(
                      r'^images:\s*(?!$)(?!-\s)(.+)$',
                      r'images:\n- \1',
                      content,
                      flags=re.MULTILINE
                  )
                  if content != original:
                      file_changed = True
                      print(f"🔧 Fixed images format: {path}")

                  # 1.3 修复 tags 格式
                  def fix_tags(match):
                      tag_val = match.group(1).strip()
                      if not tag_val or tag_val.startswith('-') or tag_val.startswith('\n'):
                          return match.group(0)
                      tags = [t.strip() for t in re.split(r'[,，]+', tag_val) if t.strip() and t.strip() != '-']
                      if not tags:
                          return match.group(0)
                      formatted_tags = "tags:\n" + "\n".join(f"- {t}" for t in tags)
                      return formatted_tags

                  content = re.sub(
                      r'^tags:\s*([^\r\n\-].*?)$',
                      fix_tags,
                      content,
                      flags=re.MULTILINE
                  )
                  if content != original:
                      file_changed = True
                      print(f"🏷️ Fixed tags format: {path}")

                  # 1.5 删除图片路径中的 /XHBlogs/public
                  new_content = re.sub(
                      r'(/XHBlogs/public)(/[^\s]*)',
                      r'\2',
                      content
                  )
                  if new_content != content:
                      content = new_content
                      file_changed = True
                      print(f"🖼️ Removed /XHBlogs/public from image path: {path}")

                  # 2. 修复 date
                  if not valid_re.search(content):
                      new_content = re.sub(
                          r'^date:\s*.*$',
                          correct_line,
                          content,
                          flags=re.MULTILINE
                      )
                      if new_content != content:
                        content = new_content
                        file_changed = True
                        print(f"⏰ Fixed bad date: {path}")
                      else:
                        content = re.sub(
                            r'^(---\s*\n)',
                            f"\\1{correct_line}\n",
                            content,
                            count=1,
                            flags=re.MULTILINE
                        )
                        file_changed = True
                        print(f"⏰ Added date: {path}")

                  # 3. 处理结尾的 --- 空行
                  if content.count('---') >= 2:
                      parts = content.split('---', 2)
                      front = parts[0] + '---' + parts[1] + '---'
                      body = parts[2]

                      if body.startswith('\n\n'):
                        pass
                      elif body.startswith('\n'):
                          content = front + '\n' + body
                          file_changed = True
                          print(f"📄 Added blank line after closing ---: {path}")
                      else:
                          content = front + '\n\n' + body
                          file_changed = True
                          print(f"📄 Added blank line after closing ---: {path}")

                  if file_changed:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      changed = True

              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          # ==================== 第三部分：自动清理无用图片（说说、文章、杂谈全覆盖） ====================
          def clean_unused_in_dir(md_folders, image_base_dir):
              global changed
              used_images = set()
              
              # 1. 收集所有指定 md 目录中引用的图片文件名
              for folder in md_folders:
                  folder_path = Path(folder)
                  if folder_path.exists():
                      for md_file in folder_path.glob("**/*.md"):
                          try:
                              text_content = md_file.read_text(encoding='utf-8', errors='ignore')
                              found = re.findall(r'!\[.*?\]\((.*?)\)|<img.*?src=["\'](.*?)["\']', text_content)
                              for item in found:
                                  p_str = item[0] or item[1]
                                  used_images.add(os.path.basename(p_str))
                          except Exception:
                              pass

              # 2. 遍历对应的图片根目录，清理没有被引用的孤儿图片
              base_path = Path(image_base_dir)
              if base_path.exists():
                  for root, dirs, files in os.walk(base_path):
                      for file in files:
                          if file.lower().endswith(('.webp', '.png', '.jpg', '.jpeg', '.gif')):
                              if file not in used_images:
                                  img_path = os.path.join(root, file)
                                  try:
                                      os.remove(img_path)
                                      changed = True
                                      print(f"🗑️ Cleaned unused image: {img_path}")
                                  except Exception as e:
                                      print(f"⚠️ Failed to remove image {img_path}: {e}")

          # 分别对 moments、posts、chatters 执行清理检查
          clean_unused_in_dir(["XHBlogs/moments"], "XHBlogs/public/moments")
          clean_unused_in_dir(["XHBlogs/posts"], "XHBlogs/public/posts")
          clean_unused_in_dir(["XHBlogs/chatters"], "XHBlogs/public/chatters")

          if not changed:
              print("✅ No files need fixing.")
          else:
              print("✅ All fixes, image fills and cleanups applied.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto fix, fill images and clean unused assets across all sections"
            git push
          fi
