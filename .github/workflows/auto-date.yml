name: Auto fill date

on:
  push:
    paths:
      - 'XHBlogs/moments/**/*.md'
      - 'XHBlogs/posts/**/*.md'
      - 'XHBlogs/chatters/**/*.md'
  workflow_dispatch:

jobs:
  fill-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-frontmatter pyyaml

      - name: Auto fill missing date
        run: |
          python << 'EOF'
          import frontmatter
          import os
          from datetime import datetime, timezone, timedelta
          import glob

          patterns = [
              'XHBlogs/moments/**/*.md',
              'XHBlogs/posts/**/*.md',
              'XHBlogs/chatters/**/*.md',
          ]

          files = []
          for p in patterns:
              files.extend(glob.glob(p, recursive=True))

          changed = False
          beijing_tz = timezone(timedelta(hours=8))
          now = datetime.now(beijing_tz).strftime('%Y-%m-%d %H:%M:%S')

          for path in files:
              if not os.path.isfile(path):
                  continue
              try:
                  post = frontmatter.load(path)
                  if 'date' not in post.metadata or not str(post.metadata.get('date') or '').strip():
                      post.metadata['date'] = now
                      with open(path, 'w', encoding='utf-8') as f:
                        f.write(frontmatter.dumps(post))
                      print(f"✅ Filled date for: {path}")
                      changed = True
              except Exception as e:
                  print(f"⚠️ Skip {path}: {e}")

          if not changed:
              print("No files need date filling.")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto fill missing date in frontmatter"
            git push
          fi
