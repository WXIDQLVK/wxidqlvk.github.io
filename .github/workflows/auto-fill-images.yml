name: Auto Fill Moments Images

on:
  push:
    paths:
      - 'public/moments/**' # 只要图片文件夹有变动就触发

jobs:
  fill-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"

      - name: Sync images for target md
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. 设置路径映射规则
          # 假设上传的图片文件夹路径是：public/moments/标题/年/月/日
          # 我们需要寻找的 md 路径是：moments/年-月-日-标题.md
          
          # 这里通过遍历判断是否有匹配的图片文件夹，防止 Action 对所有文件都跑一遍
          found_folder = None
          for root, dirs, files in os.walk('public/moments'):
              # 简单的路径拆解：['public', 'moments', '标题', '年', '月', '日']
              parts = root.split(os.sep)
              if len(parts) >= 6:
                  title = parts[2]
                  year, month, day = parts[3], parts[4], parts[5]
                  
                  # 对应的 md 文件名
                  md_filename = f"{year}-{month}-{day}-{title}.md"
                  md_path = os.path.join('moments', md_filename)
                  
                  if os.path.exists(md_path):
                      # 找到匹配了，开始处理
                      images = sorted([f for f in files if f.lower().endswith(('.jpg', '.png', '.jpeg'))])
                      if not images: continue
                      
                      # 构建多行 yaml
                      yaml_lines = ["images:"]
                      for img in images:
                          yaml_lines.append(f"  - /moments/{title}/{year}/{month}/{day}/{img}")
                      new_block = "\n".join(yaml_lines)
                      
                      # 读取 md 并替换
                      with open(md_path, 'r', encoding='utf-8') as f:
                          content = f.read()
                          
                      pattern = r'images:\s*(\n\s*-\s*[^\r\n]+)*'
                      if re.search(pattern, content):
                          new_content = re.sub(pattern, new_block, content)
                      else:
                          # 没找到 images 字段就插在 title 下面
                          new_content = re.sub(r'(title:.*)', r'\1\n' + new_block, content)
                          
                      if new_content != content:
                          with open(md_path, 'w', encoding='utf-8') as f:
                              f.write(new_content)
                          print(f"成功更新: {md_path}")
          EOF

          git add .
          if not git diff --cached --quiet; then
              git commit -m "Auto sync images for moments"
              git push
          fi
