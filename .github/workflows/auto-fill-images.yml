name: Auto Fill Moments Images

on:
  push:

jobs:
  fill-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"

      - name: Precise sync images
        run: |
          python3 - << 'EOF'
          import os, glob, re

          md_files = glob.glob('moments/**/*.md', recursive=True) + glob.glob('public/moments/**/*.md', recursive=True)
          if not md_files:
              print('未找到 md 文件')
              exit(0)

          latest_md = max(md_files, key=os.path.getmtime)
          print(f'正在处理文件: {latest_md}')

          with open(latest_md, 'r', encoding='utf-8') as f:
              content = f.read()

          basename = os.path.basename(latest_md)
          name_match = re.match(r'(\d{4})-(\d{2})-(\d{2})-(.+)\.md', basename)
          
          if name_match:
              year, month, day, title = name_match.groups()
          else:
              year, month, day = '2026', '08', '21'
              title_m = re.search(r'^title:\s*(.+)$', content, re.MULTILINE)
              title = title_m.group(1).strip().strip('\"\'') if title_m else 'unknown'

          target_dirs = glob.glob(f'**/moments/**/{title}/{year}/{month}/{day}', recursive=True)
          if not target_dirs:
              target_dirs = glob.glob(f'**/{title}/{year}/{month}/{day}', recursive=True)

          if not target_dirs:
              print('没有找到对应的图片文件夹')
              exit(0)

          img_folder = target_dirs[0]
          images = sorted(glob.glob(os.path.join(img_folder, '*.jpg')) + glob.glob(os.path.join(img_folder, '*.png')) + glob.glob(os.path.join(img_folder, '*.JPG')) + glob.glob(os.path.join(img_folder, '*.PNG')))

          if images:
              img_paths = []
              for img in images:
                  rel = img.replace('public', '', 1).replace('\\', '/')
                  if not rel.startswith('/'): rel = '/' + rel
                  if '/moments/' in rel:
                      rel = '/moments' + rel.split('/moments')[1]
                  img_paths.append(rel)

              # 核心修正：严格按照图2的格式，'-' 前面加 2 个空格
              images_yaml = 'images:\n' + '\n'.join([f'  - {p}' for p in img_paths])

              # 精准替换旧的 images 字段到下一个字段之前的内容
              new_content = re.sub(r'images:\s*(\n\s*-\s*[^\r\n]+)*', images_yaml, content)

              if new_content != content:
                  with open(latest_md, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print('成功生成图2一样的多行图片列表！')
          EOF

          git add .
          if git diff --cached --quiet; then
              echo "没有变动"
          else
              git commit -m "Match exact image format [skip ci]"
              git push
          fi
