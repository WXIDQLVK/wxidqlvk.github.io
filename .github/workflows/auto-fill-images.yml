name: Auto Fill Moments Images

on:
  push:
    paths:
      - 'moments/**'
      - 'public/moments/**'

jobs:
  fill-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"

      - name: Sync images by matching title
        run: |
          python3 -c "
          import os, glob, re

          # 1. 找到最近修改的 md 文件
          md_files = glob.glob('moments/**/*.md', recursive=True) + glob.glob('public/moments/**/*.md', recursive=True)
          if not md_files:
              exit(0)

          latest_md = max(md_files, key=os.path.getmtime)
          print(f'处理文章: {latest_md}')

          with open(latest_md, 'r', encoding='utf-8') as f:
              content = f.read()

          # 2. 直接从内容中提取 title: 后面的名字
          title_match = re.search(r'^title:\s*(.+)$', content, re.MULTILINE)
          if not title_match:
              print('未找到文章标题')
              exit(0)

          blog_title = title_match.group(1).strip().strip('\"\'')
          print(f'提取到的文章标题（也是文件夹名）: {blog_title}')

          # 3. 在整仓中寻找名字跟 blog_title 一模一样的图片文件夹
          target_dirs = []
          for root, dirs, files in os.walk('.'):
              if blog_title in dirs:
                  target_dirs.append(os.path.join(root, blog_title))

          if not target_dirs:
              print('未找到同名图片文件夹')
              exit(0)

          # 取找到的第一个同名文件夹
          img_folder = target_dirs[0]
          print(f'定位到同名图片文件夹: {img_folder}')

          # 4. 获取该文件夹下（或其子目录里）的所有图片
          all_imgs = []
          for r, d, fs in os.walk(img_folder):
              for file in fs:
                  if file.lower().endswith(('.jpg', '.jpeg', '.png', '.JPG', '.PNG')):
                      all_imgs.append(os.path.join(r, file))

          # 按文件名排序 (1.jpg, 2.jpg, 3.jpg...)
          all_imgs = sorted(all_imgs)

          if all_imgs:
              img_paths = []
              for img in all_imgs:
                  rel = img.replace('public', '', 1).replace('\\', '/')
                  if not rel.startswith('/'): rel = '/' + rel
                  if '/moments/' in rel:
                      rel = '/moments' + rel.split('/moments')[1]
                  img_paths.append(rel)

              print(f'生成的所有图片路径: {img_paths}')

              # 5. 替换 Markdown 里的 images 列表
              images_yaml = 'images:\n' + '\n'.join([f'  - {p}' for p in img_paths])
              new_content = re.sub(r'images:\s*(\n\s*-\s*[^\r\n]+)*', images_yaml, content)

              if new_content != content:
                  with open(latest_md, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print('成功按标题同名字段补全所有图片路径！')
          "

          git add .
          if git diff --cached --quiet; then
              echo "无改动"
          else
              git commit -m "Auto fill images by title match [skip ci]"
              git push
          fi
