name: 自动生成 Moments 时间

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-moments:
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库
        uses: actions/checkout@v4

      - name: 自动生成时间和 ID
        shell: python
        run: |
          import os
          import re
          import time
          from datetime import datetime, timezone

          folder = "moments"

          # 当前 UTC 时间
          now = datetime.now(timezone.utc)
          now_iso = now.strftime("%Y-%m-%dT%H:%M:%S.000Z")

          # 当前时间戳
          timestamp = int(time.time() * 1000)

          # 遍历 moments 文件夹
          for filename in os.listdir(folder):

              if not filename.endswith(".md"):
                  continue

              filepath = os.path.join(folder, filename)

              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              # 已经有 date 和 id 的文章不修改
              has_date = re.search(
                  r'^date:\s*["\']?.+?["\']?\s*$',
                  content,
                  re.MULTILINE
              )

              has_id = re.search(
                  r'^id:\s*["\']?.+?["\']?\s*$',
                  content,
                  re.MULTILINE
              )

              # 如果已经有 date 和 id，就跳过
              if has_date and has_id:
                  continue

              # 生成 ID
              moment_id = f"moment-{timestamp}"

              # 如果没有 Front Matter，就创建
              if not content.startswith("---"):
                  content = (
                      "---\n"
                      f'id: "{moment_id}"\n'
                      f'date: "{now_iso}"\n'
                      "---\n\n"
                      + content
                  )

              else:
                  # 在 Front Matter 中添加 ID
                  if not has_id:
                      content = re.sub(
                          r'^---\n',
                          f'---\nid: "{moment_id}"\n',
                          content,
                          count=1
                      )

                  # 添加 date
                  if not has_date:
                      content = re.sub(
                          r'^---\n',
                          f'---\ndate: "{now_iso}"\n',
                          content,
                          count=1
                      )

              with open(filepath, "w", encoding="utf-8") as f:
                  f.write(content)

              print(f"已处理: {filepath}")

              # 一次只处理一个新文章
              break

      - name: 提交自动生成的内容
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add moments/

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
          else
            git commit -m "自动生成 Moments 时间和 ID"
            git push
          fi
