name: Auto Fix and Retry on Failure

on:
  workflow_run:
    workflows: ["Deploy Next.js site to Pages"] 
    types:
      - completed

jobs:
  fix-and-retry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"

      - name: Add space after title and push
        run: |
          # 寻找最近修改过的那篇 Markdown 文件
          LATEST_FILE=$(git log -1 --name-only --pretty="" | grep "\.md$" | head -n 1)
          
          if [ -z "$LATEST_FILE" ]; then
            LATEST_FILE=$(find . -name "*.md" | head -n 1)
          fi

          echo "正在处理文件: $LATEST_FILE"
          
          if [ -f "$LATEST_FILE" ]; then
            # 精准定位 title: 那一行，在文字末尾自动加一个空格
            sed -i '/^title:/s/$/ /' "$LATEST_FILE"
            
            git add "$LATEST_FILE"
            git commit -m "Auto-fix: add space to title for successful rebuild"
            git push
          else
            echo "未找到 Markdown 文件"
          fi
