name: 自动重新构建网页

on:
  workflow_run:
    workflows: ["Deploy Next.js site to Pages"]
    types:
      - completed

jobs:
  trigger-new-build:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for 10 seconds
        run: sleep 10

      - name: Dispatch a fresh build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "正在派发一次全新的构建任务..."
          gh workflow run "Deploy Next.js site to Pages"
