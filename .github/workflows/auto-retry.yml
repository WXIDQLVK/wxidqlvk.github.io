name: Auto Fix and Retry on Failure

on:
  workflow_run:
    workflows: ["Deploy Next.js site to Pages"] 
    types:
      - completed

jobs:
  fix-and-retry:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: `${{ secrets.GITHUB_TOKEN }}`

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"

      - name: Add space to title and push
        run: |
          # 找出最后修改的一个 md 文件
          FILE=$(git status --porcelain | awk '{print $2}' | grep '\.md$' | tail -n 1)
          if [ -z "$FILE" ]; then
            FILE=$(find . -name "*.md" | sort -r | head -n 1)
          fi
          
          echo "修改文件: $FILE"
          
          # 直接在 title: 后面加一个空格
          sed -i 's/^title: \(.*\)/title: \1 /' "$FILE"
          
          git add "$FILE"
          git commit -m "Auto-fix: add space"
          git push
