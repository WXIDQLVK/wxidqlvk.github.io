name: Auto Fix Markdown Titles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add space after title
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          for file in Path(".").rglob("*.md"):
              if ".git" in file.parts:
                  continue

              text = file.read_text(encoding="utf-8")

              # 只处理 Front Matter（开头 --- 到 ---）里的 title
              match = re.match(
                  r"^---\s*\n(.*?)\n---",
                  text,
                  flags=re.DOTALL
              )

              if not match:
                  continue

              front_matter = match.group(1)

              # 找到 title:
              new_front_matter = re.sub(
                  r"^(title:\s*)(.*?)\s*$",
                  lambda m: m.group(1) + m.group(2).rstrip() + " ",
                  front_matter,
                  count=1,
                  flags=re.MULTILINE
              )

              if new_front_matter != front_matter:
                  new_text = text.replace(
                      front_matter,
                      new_front_matter,
                      1
                  )

                  file.write_text(new_text, encoding="utf-8")
                  print(f"Fixed: {file}")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.md'

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "fix: add space after markdown titles"
            git push
          fi
